version: '2'

run:
  timeout: 5m
  tests: true

linters:
  # default: none — включаем только явно перечисленные.
  # Иначе golangci-lint тянет дефолтный набор + новые линтеры
  # при каждом обновлении, и прогон внезапно падает.
  default: none

  enable:
    - errcheck # непроверенные ошибки
    - govet # go vet (shadow, printf, structtag)
    - ineffassign # присваивание без использования
    - misspell # опечатки
    - revive # стиль (замена golint)
    - staticcheck # SA* (в v2 включает gosimple, stylecheck)
    - unused # неиспользуемые функции/переменные

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close

        - (*database/sql.DB).Close

        - (*github.com/golang-migrate/migrate/v4.Migrate).Close

        - (*github.com/minio/minio-go/v7.Object).Close

    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - revive
          - unused

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
